<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeknoJet Plus | Gaziantep Hızlı Teknoloji Kuryesi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            padding: 30px 20px;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .hero-title p {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .order-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .service-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .service-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            color: var(--text-sub);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .service-btn i {
            font-size: 1.4rem;
        }

        .service-btn.active {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        .price-calculator {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-info span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 700;
        }

        .price-info h3 {
            font-size: 2rem;
            color: var(--accent-green);
            font-weight: 800;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent-green);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        footer {
            margin-top: auto;
            padding: 25px;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .service-selector { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt" style="color: var(--accent-green);"></i> TEKNOJET<span>PLUS</span>
        </div>
        <div class="badge">
            <i class="fa-solid fa-circle" style="font-size: 8px;"></i> 30 Dk. Hızlı Teslimat
        </div>
    </header>

    <div class="main-container">
        <div class="hero-title">
            <h1>Hızlı Teknoloji Kuryesi</h1>
            <p>Gaziantep içi acil şarj, kablo, aksesuarlar anında adresinizde!</p>
        </div>

        <div class="order-card">
            <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; display: block; margin-bottom: 12px;">Hizmet / Ürün Türü Seçin</label>
            <div class="service-selector">
                <div class="service-btn active" data-service="Acil Powerbank / Şarj Kuryesi" data-price="120">
                    <i class="fa-solid fa-charging-station"></i>
                    Acil Powerbank Kurye
                </div>
                <div class="service-btn" data-service="Kablo & Adaptör Teslimatı" data-price="100">
                    <i class="fa-solid fa-plug"></i>
                    Kablo & Adaptör Getir
                </div>
            </div>

            <form id="orderForm">
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fa-regular fa-user"></i> Ad Soyad</label>
                        <input type="text" id="customerName" class="form-control" placeholder="Hasan Aslan" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-phone"></i> Telefon Numarası</label>
                        <input type="tel" id="phone" class="form-control" placeholder="0507 518 8663" required>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-location-dot"></i> Teslimat Adresi (Gaziantep)</label>
                    <textarea id="address" class="form-control" placeholder="Mahalle, Cadde, Sokak, Bina No ve İrtibat detayları..." required></textarea>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-wallet"></i> Ödeme Yöntemi</label>
                    <select id="paymentMethod" class="form-control">
                        <option value="Kapıda Nakit">Kapıda Nakit Ödeme</option>
                        <option value="Kapıda Kredi Kartı">Kapıda POS / Kredi Kartı</option>
                        <option value="Havale / EFT">Havale / EFT</option>
                    </select>
                </div>

                <div class="price-calculator">
                    <div class="price-info">
                        <span>Hesaplanan Hizmet Tutarı</span>
                        <h3 id="totalPriceDisplay">120 TL</h3>
                    </div>
                    <div style="color: var(--text-sub); font-size: 0.85rem; text-align: right;">
                        <i class="fa-solid fa-bolt" style="color: var(--accent-green);"></i> Işık Hızında Teslimat
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Siparişi Onayla & Kurye Çağır
                </button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 TeknoJet Plus - Gaziantep Acil Teknoloji Kurye Ağı
    </footer>

    <script>
        let selectedService = "Acil Powerbank / Şarj Kuryesi";
        let currentPrice = 120;

        document.querySelectorAll('.service-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedService = this.getAttribute('data-service');
                currentPrice = parseInt(this.getAttribute('data-price'));
                document.getElementById('totalPriceDisplay').innerText = currentPrice + " TL";
            });
        });

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.querySelector('.btn-submit');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gönderiliyor...';
            btn.disabled = true;

            const orderData = {
                customerName: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                paymentMethod: document.getElementById('paymentMethod').value,
                serviceType: selectedService,
                total: currentPrice
            };

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const data = await res.json();

                if (data.success) {
                    alert('🚀 Siparişiniz başarıyla alındı! Kuryemiz yola çıktı. WhatsApp üzerinden onay mesajınız iletilmiştir.');
                    document.getElementById('orderForm').reset();
                } else {
                    alert('Hata oluştu: ' + data.error);
                }
            } catch (err) {
                alert('Bağlantı hatası oluştu!');
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Siparişi Onayla & Kurye Çağır';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
